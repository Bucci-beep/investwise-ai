[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "investwise-ai"
version = "0.1.0"
description = "Explainable investment suitability decision support system"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
